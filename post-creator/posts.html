<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy Social Posts</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>"
    />
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1f2430;
        --muted: #5d6475;
        --border: #d9dce3;
        --accent: #2c5bd6;
        --accent-soft: #e8eefc;
        --ok: #1a7f37;
        --ok-soft: #e3f4e8;
        --warn-bg: #fff6db;
        --warn: #8a5a00;
        --error: #c62828;
        --error-soft: #fde7e7;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      a {
        color: var(--accent);
      }
      header,
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 8px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      header h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      nav {
        display: flex;
        align-items: center;
        gap: 16px;
        flex: none;
      }
      .button {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        padding: 8px 14px;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 1px;
      }
      main {
        padding-bottom: 48px;
      }
      h2 {
        font-size: 1.15rem;
        margin: 24px 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .count {
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        padding: 0 10px;
        font-size: 0.85rem;
      }
      h3 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 20px 0 8px;
      }
      .icon {
        width: 16px;
        height: 16px;
        flex: none;
        fill: currentColor;
      }
      .post {
        display: flex;
        gap: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
      }
      .when {
        flex: none;
        width: 64px;
        text-align: center;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        padding: 6px 0;
        align-self: flex-start;
        line-height: 1.2;
      }
      .when strong {
        display: block;
        font-size: 1.6rem;
      }
      .when span {
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .posted .when {
        background: var(--bg);
        color: var(--muted);
      }
      .body {
        min-width: 0;
        flex: 1;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .meta strong {
        color: var(--text);
      }
      .tag {
        border-radius: 999px;
        padding: 0 8px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .tag.soon {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .tag.failed {
        background: var(--error-soft);
        color: var(--error);
      }
      .text {
        margin: 6px 0 10px;
        white-space: pre-line;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .accounts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .account {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.85rem;
        background: var(--bg);
        color: var(--muted);
      }
      .account.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .account.failed {
        background: var(--error-soft);
        color: var(--error);
      }
      .thumb {
        flex: none;
        width: 120px;
        height: 90px;
        border-radius: 8px;
        object-fit: cover;
        background: var(--bg);
      }
      .empty {
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
        padding: 24px 16px;
      }
      .note {
        color: var(--warn);
        background: var(--warn-bg);
        border-radius: 8px;
        padding: 8px 12px;
      }
      .more {
        display: block;
        margin: 16px auto 0;
      }
      @media (max-width: 640px) {
        header {
          flex-direction: column;
          align-items: flex-start;
        }
        .thumb {
          display: none;
        }
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>

  <body>

    <header>
      <div>
        <h1>Galaxy Social Posts</h1>
        <p>Posts waiting for their scheduled time, and the ones already sent out.</p>
      </div>
      <nav>
        <a class="button" href="./">Create a post</a>
        <a href="https://github.com/usegalaxy-eu/galaxy-social" target="_blank">
          <svg class="icon" style="width: 24px; height: 24px"><use href="#icon-github" /></svg>
          <span class="visually-hidden">GitHub repository</span>
        </a>
      </nav>
    </header>

    <main>
      <p class="note" id="note" hidden></p>
      <section aria-labelledby="upcoming-title">
        <h2 id="upcoming-title">⏰ Scheduled <span class="count" id="upcoming-count"></span></h2>
        <div id="upcoming"><p class="empty">Loading…</p></div>
      </section>
      <section aria-labelledby="posted-title">
        <h2 id="posted-title">✅ Already posted <span class="count" id="posted-count"></span></h2>
        <div id="posted"></div>
        <button class="more" id="more" hidden>Show older posts</button>
      </section>
    </main>

    <script>
      const REPO = "usegalaxy-eu/galaxy-social";
      const PAGE_SIZE = 30;
      const OWNERS = {
        galaxyproject: "Galaxy Project",
        eu: "Galaxy Europe",
        brc: "BRC Analytics",
        vgp: "Vertebrate Genomes Project",
      };
      const $ = (id) => document.getElementById(id);
      const dayFormat = new Intl.DateTimeFormat(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
      const monthFormat = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });
      const relative = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function icon(platform) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "icon");
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", `#icon-${platform}`);
        svg.appendChild(use);
        return svg;
      }

      function fromNow(date) {
        const minutes = (date - Date.now()) / 60000;
        if (Math.abs(minutes) < 60) return relative.format(Math.round(minutes), "minute");
        if (Math.abs(minutes) < 48 * 60) return relative.format(Math.round(minutes / 60), "hour");
        return relative.format(Math.round(minutes / 1440), "day");
      }

      // Plain text of the markdown, good enough for a short excerpt
      function excerpt(text) {
        return text
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/[*`]{1,3}/g, "")
          .replace(/\n{3,}/g, "\n\n");
      }

      function card(post, status, upcoming) {
        const date = new Date(post.schedule || post.added || 0);
        const results = Object.values(status || {});
        const item = el("article", upcoming ? "post" : "post posted");

        const when = el("div", "when");
        when.append(el("strong", "", date.getDate()), el("span", "", date.toLocaleString(undefined, { month: "short" })));
        item.append(when);

        const body = el("div", "body");
        const meta = el("div", "meta");
        meta.append(el("strong", "", dayFormat.format(date)));
        meta.lastChild.title = date.toISOString().replace("T", " ").slice(0, 16) + " UTC";
        if (upcoming && date <= Date.now()) {
          meta.append(el("span", "tag soon", "Going out in the next few minutes"));
        } else if (upcoming || date > Date.now() - 7 * 864e5) {
          meta.append(el("span", "", fromNow(date)));
        }
        if (!upcoming && !results.some(Boolean)) meta.append(el("span", "tag failed", "Not posted"));
        const file = el("a", "", "View file");
        file.href = `https://github.com/${REPO}/blob/main/${post.path}`;
        file.target = "_blank";
        meta.append(file);
        body.append(meta, el("p", "text", excerpt(post.text)));

        const accounts = el("div", "accounts");
        post.media.forEach((name) => {
          const [platform, owner] = name.split("-");
          const result = status?.[name];
          const chip = el("span", result === true ? "account ok" : result === false ? "account failed" : "account");
          chip.title = `${name}: ${result === true ? "posted" : result === false ? "failed" : upcoming ? "waiting" : "no record"}`;
          chip.append(icon(platform), OWNERS[owner] || name.split("-").slice(1).join(" "));
          if (result !== undefined) chip.append(result ? " ✓" : " ✗");
          accounts.append(chip);
        });
        body.append(accounts);
        item.append(body);

        if (post.image) {
          const img = el("img", "thumb");
          img.src = post.image;
          img.alt = "";
          img.loading = "lazy";
          img.onerror = () => img.remove();
          item.append(img);
        }
        return item;
      }

      document.addEventListener("DOMContentLoaded", async () => {
        let posts = [];
        let processed = {};
        try {
          posts = await (await fetch("posts.json")).json();
        } catch (e) {
          console.error(e);
          $("upcoming").replaceChildren(el("p", "empty", "Couldn't load the posts. Please reload the page."));
          return;
        }
        try {
          // Live record of what went out, kept by the posting workflow
          const res = await fetch(`https://raw.githubusercontent.com/${REPO}/processed_files/processed_files.json`);
          processed = await res.json();
        } catch (e) {
          console.error(e);
          $("note").textContent = "Couldn't load which posts went out. The list below may be out of date.";
          $("note").hidden = false;
        }

        const time = (p) => new Date(p.schedule || p.added || 0).getTime();
        const upcoming = posts.filter((p) => p.schedule && !(p.path in processed)).sort((a, b) => time(a) - time(b));
        const posted = posts.filter((p) => !upcoming.includes(p)).sort((a, b) => time(b) - time(a));

        $("upcoming-count").textContent = upcoming.length;
        $("upcoming").replaceChildren(
          ...(upcoming.length
            ? upcoming.map((p) => card(p, processed[p.path], true))
            : [el("p", "empty", "Nothing is scheduled right now. Pick a time in the Post Creator to plan a post.")])
        );

        $("posted-count").textContent = posted.length;
        let shown = 0;
        let month = "";
        function showMore() {
          posted.slice(shown, shown + PAGE_SIZE).forEach((p) => {
            const label = monthFormat.format(time(p));
            if (label !== month) $("posted").append(el("h3", "", (month = label)));
            $("posted").append(card(p, processed[p.path], false));
          });
          shown += PAGE_SIZE;
          $("more").hidden = shown >= posted.length;
        }
        $("more").onclick = showMore;
        showMore();
      });
    </script>
  </body>
</html>
