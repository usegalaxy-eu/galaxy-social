name: Deploy Post Creator App

on:
  push:
    branches: [main]
    paths:
      - "post-creator/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/scripts/build_suggestions.py"

  # Refresh the hashtag and mention suggestions from new posts once a week
  schedule:
    - cron: "17 5 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Post Creator to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build hashtag and mention suggestions
        run: |
          python -m pip install PyYAML==6.0.1
          python .github/scripts/build_suggestions.py posts post-creator/suggestions.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./post-creator"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
